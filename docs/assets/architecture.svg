<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">FridgeChef architecture</title>
  <desc id="description">The host uses an LLM and an MCP client to call a FastMCP server over stdio. The server exposes search_recipes, cook_tonight and add_to_shopping_list. cook_tonight calls the search and action functions internally. Searches read TheMealDB; actions write a local JSON list. The host reads the shopping-list resource before each turn.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#576b68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; fill: #183d37; }
      .muted { fill: #526b66; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 27px; font-weight: 650; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 23px; font-weight: 600; }
      .body { font-size: 20px; }
      .small { font-size: 18px; }
      .link { fill: none; stroke: #576b68; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="900" rx="24" fill="#f6f8f5"/>
  <rect x="40" y="38" width="6" height="44" rx="3" fill="#25836c"/>
  <text x="62" y="64" font-size="34" font-weight="700">From fridge to dinner</text>
  <text x="62" y="100" class="body muted">The agent chooses a tool. The server searches, ranks and saves.</text>
  <rect x="1176" y="44" width="184" height="38" rx="19" fill="#e0eee6"/>
  <text x="1268" y="69" text-anchor="middle" class="small" font-weight="600">MCP TOOLKIT</text>

  <rect x="40" y="144" width="330" height="560" rx="20" fill="#fff" stroke="#d3e0d9"/>
  <text x="64" y="184" class="eyebrow muted">HOST &amp; CLIENT</text>
  <text x="64" y="225" class="heading">agent.py</text>
  <text x="64" y="254" class="body muted">OpenAI Agents SDK</text>
  <rect x="64" y="285" width="282" height="78" rx="12" fill="#f1f5ef"/>
  <text x="84" y="317" class="body" font-weight="600">Your request</text>
  <text x="84" y="345" class="small muted">“What can I cook?”</text>
  <path d="M205 363 V392" class="link"/>
  <rect x="64" y="392" width="282" height="94" rx="12" fill="#e9f2ee" stroke="#afcbbf"/>
  <text x="84" y="428" class="body" font-weight="650">Agent + MCP client</text>
  <text x="84" y="458" class="small muted">Call tools · return results</text>
  <path d="M205 486 V544" class="link" marker-start="url(#arrow)"/>
  <text x="220" y="520" class="small muted">model calls</text>
  <rect x="64" y="544" width="282" height="132" rx="12" fill="#fafbf8" stroke="#d3e0d9"/>
  <text x="84" y="579" class="body" font-weight="650">Configured model</text>
  <text x="84" y="610" class="small muted">Bedrock · OpenAI</text>
  <text x="84" y="640" class="small muted">or OpenRouter</text>

  <path d="M370 440 H510" class="link" marker-start="url(#arrow)"/>
  <text x="440" y="405" text-anchor="middle" class="body" font-weight="700">MCP</text>
  <text x="440" y="475" text-anchor="middle" class="small muted">JSON-RPC</text>
  <text x="440" y="500" text-anchor="middle" class="small muted">over stdio</text>

  <rect x="510" y="144" width="520" height="560" rx="20" fill="#fff" stroke="#d3e0d9"/>
  <text x="534" y="184" class="eyebrow muted">SERVER</text>
  <text x="534" y="220" class="heading">FastMCP · server.py</text>
  <rect x="534" y="246" width="472" height="98" rx="12" fill="#edf3fc" stroke="#bfd0e7"/>
  <text x="554" y="273" class="eyebrow" style="fill:#426391">DATA</text>
  <text x="554" y="306" class="code">search_recipes</text>
  <text x="554" y="331" class="small muted">Return recipes and ingredients</text>
  <path d="M575 410 V344" class="link"/>
  <text x="596" y="383" class="small muted">Search each fridge ingredient</text>
  <rect x="534" y="410" width="472" height="115" rx="12" fill="#e6f2e9" stroke="#94bda3"/>
  <text x="554" y="438" class="eyebrow" style="fill:#327348">ORCHESTRATION</text>
  <text x="554" y="472" class="code">cook_tonight</text>
  <text x="554" y="503" class="small muted">Rank candidates · matching.py</text>
  <path d="M575 525 V586" class="link"/>
  <text x="596" y="563" class="small muted">Save missing ingredients</text>
  <rect x="534" y="586" width="472" height="92" rx="12" fill="#fff3df" stroke="#e0c895"/>
  <text x="554" y="613" class="eyebrow" style="fill:#88601e">ACTION</text>
  <text x="554" y="650" class="code">add_to_shopping_list</text>

  <text x="1140" y="184" class="eyebrow muted">DATA &amp; STORAGE</text>
  <rect x="1140" y="246" width="220" height="98" rx="12" fill="#fff" stroke="#bfd0e7"/>
  <text x="1160" y="284" font-size="25" font-weight="650">TheMealDB</text>
  <text x="1160" y="315" class="body muted">Recipe API</text>
  <path d="M1006 295 H1140" class="link"/>
  <text x="1073" y="279" text-anchor="middle" class="small muted">HTTP</text>
  <rect x="1140" y="586" width="220" height="92" rx="12" fill="#fff" stroke="#e0c895"/>
  <text x="1160" y="622" font-size="25" font-weight="650">Shopping list</text>
  <text x="1160" y="653" class="body muted">Local JSON file</text>
  <path d="M1006 632 H1140" class="link"/>
  <text x="1073" y="616" text-anchor="middle" class="small muted">write</text>

  <rect x="40" y="734" width="1320" height="126" rx="18" fill="#e9efeb"/>
  <text x="64" y="773" font-size="23" font-weight="650">Resources are read separately from tool calls</text>
  <text x="64" y="811" class="code" style="font-size:21px">shopping-list://current</text>
  <text x="410" y="811" class="small muted">Loaded into context before each turn</text>
  <text x="64" y="841" class="code" style="font-size:21px">recipe://{meal_id}</text>
  <text x="410" y="841" class="small muted">Full recipe details available to other MCP clients</text>
</svg>
